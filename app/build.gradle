plugins {
    id "com.android.application"
}

def xposedApiJar = file("../xposed-api-stub/build/libs/xposed-api-stub.jar")

android {
    namespace "com.leo.doubaoimehook"
    compileSdk 36

    defaultConfig {
        applicationId "com.leo.doubaoimehook"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly files(xposedApiJar)
    testImplementation "junit:junit:4.13.2"
}

tasks.named("preBuild") {
    dependsOn(":xposed-api-stub:jar")
}
