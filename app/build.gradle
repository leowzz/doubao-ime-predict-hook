plugins {
    id "com.android.application"
}

def xposedApiJar = file("../xposed-api-stub/build/libs/xposed-api-stub.jar")
def moduleVersionName = providers.gradleProperty("VERSION_NAME").getOrElse("1.0.0")
def moduleVersionCode = providers.gradleProperty("VERSION_CODE").getOrElse("1000000").toInteger()
def releaseKeystoreFile = providers.environmentVariable("DOUBAO_IME_KEYSTORE_FILE")
def releaseKeystorePassword = providers.environmentVariable("DOUBAO_IME_KEYSTORE_PASSWORD")
def releaseKeyAlias = providers.environmentVariable("DOUBAO_IME_KEY_ALIAS")
def releaseKeyPassword = providers.environmentVariable("DOUBAO_IME_KEY_PASSWORD")
def releaseSigningValues = [
    releaseKeystoreFile,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def hasReleaseSigning = releaseSigningValues.every { it.isPresent() }
if (releaseSigningValues.any { it.isPresent() } && !hasReleaseSigning) {
    throw new GradleException(
        "DOUBAO_IME_KEYSTORE_FILE, DOUBAO_IME_KEYSTORE_PASSWORD, DOUBAO_IME_KEY_ALIAS, and DOUBAO_IME_KEY_PASSWORD must be set together"
    )
}

android {
    namespace "com.leo.doubaoimehook"
    compileSdk 36

    defaultConfig {
        applicationId "com.leo.doubaoimehook"
        minSdk 26
        targetSdk 35
        versionCode moduleVersionCode
        versionName moduleVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create("release") {
                storeFile file(releaseKeystoreFile.get())
                storePassword releaseKeystorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.getByName("release")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly files(xposedApiJar)
    testImplementation "junit:junit:4.13.2"
}

tasks.named("preBuild") {
    dependsOn(":xposed-api-stub:jar")
}
